name: Darb site quality
on:
  push:
    branches:
      - feature/darb-site-foundation-20261102
    paths:
      - "site/**"
      - ".github/workflows/darb-site-checks.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/darb-site-checks.yml"
  workflow_dispatch:
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (initial lockfile bootstrapping)
        run: npm install --no-audit --no-fund
      - name: Source audit tests
        run: npm run check:content
      - name: TypeScript
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install browser for real-route tests
        run: npx playwright install --with-deps chromium
      - name: Browser / mobile / bilingual smoke
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload browser screenshots on every run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darb-browser-evidence
          path: |
            site/test-results/
            site/playwright-report/
          if-no-files-found: ignore
